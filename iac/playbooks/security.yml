---
- name: Secure home lab environment
  hosts: all
  become: true
  gather_facts: true

  tasks:

    # ---------------------------------------------------------
    # SSH HARDENING
    # DISABLE ROOT LOGIN, PASSWORD AUTHENTICATION, AND KBDINTERACTIVE AUTHENTICATION
    # ---------------------------------------------------------

    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    - name: Disable SSH KbdInteractive authentication
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?KbdInteractiveAuthentication'
        line: 'KbdInteractiveAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart SSH

    # ---------------------------------------------------------
    # AUTOMATIC SECURITY UPDATES
    # Set up unattended upgrades to automatically install security updates
    # ---------------------------------------------------------

    - name: Install unattended upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
        state: present

    - name: Enable automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

  handlers:

    - name: Restart SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted
